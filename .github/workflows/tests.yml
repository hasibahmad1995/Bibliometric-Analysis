name: tests

# Run the tests on every push and on every pull request.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7          # copy the repository onto the runner

      - uses: actions/setup-python@v7      # install Python
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: pytest
